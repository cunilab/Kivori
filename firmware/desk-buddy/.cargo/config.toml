# ESP32-C3 is RISC-V (riscv32imc): standard Rust + the riscv target (NOT the xtensa esp fork).
[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
# esp-hal supplies the memory layout + vector table through `linkall.x`. Only the device target needs
# it; host builds pass an explicit --target and never see these flags.
rustflags = ["-C", "link-arg=-Tlinkall.x"]
