# Isolated firmware Cargo workspace — feature-unification firewall (see ADR-0001).
# NOT a member of the root workspace; consumes the shared crates via path dependencies.
[workspace]
resolver = "2"

[package]
name = "kivori-firmware"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
description = "Kivori ESP32-C3 firmware (no_std). Scaffold; board bring-up + runtime land in Phase 8 (T070+)."

# Hardware-neutral device core lives in the library so it is testable on the host (constraint 4).
[lib]
name = "kivori_firmware"
path = "src/lib.rs"

[[bin]]
name = "kivori-firmware"
path = "src/main.rs"
# The flashable binary needs the esp-hal entry point (Phase 8); gate it behind `embedded` so host
# `cargo test` skips it and builds only the hardware-neutral library + host-sim tests.
required-features = ["embedded"]

[features]
default = []
# esp-hal runtime + flashable entry point. Board peripherals (USB Serial/JTAG transport, SPI display)
# are still Phase 8; this feature provides boot, the monotonic clock, and serial output.
embedded = ["dep:esp-hal", "dep:esp-println", "dep:esp-backtrace", "dep:embedded-hal-bus"]
# Host simulation adapters (in-memory transport, capture display, virtual clock) for testing the
# device core with no hardware.
host-sim = []
# Wokwi pre-hardware simulation: the embedded runtime plus an in-firmware self-test harness that
# drives the REAL dispatcher/lifecycle/renderer and asserts over serial (see sim/wokwi/README.md).
# Simulation is an extra gate — it never replaces the host-sim tests or physical validation.

physical-st7789 = ["embedded", "dep:static_cell"]


wokwi = ["embedded"]
# Wokwi EXTERNAL serial test: the real USB Serial/JTAG receive/transmit loop, driven by Wokwi
# `write-serial` automation injecting real wire frames (see sim/wokwi/generated/*.yaml).
wokwi-serial = ["embedded"]
# Wokwi STAGE-2 GENERIC SPI/RGB565 tile-transfer probe: drives the real T072 `mipidsi` DisplaySink over
# the real esp-hal SPI peripheral against Wokwi's built-in `wokwi-ili9341` part, used ONLY as a generic
# SPI/RGB565/tile-transfer probe. It validates bus activity, command/data phases, tile geometry, byte
# volume, and change-driven refresh. It does NOT validate the Kivori panel's controller, init sequence,
# offsets, colour order, orientation, or backlight — the physical controller is unconfirmed (see
# sim/wokwi/README.md "What this does not prove").
wokwi-spi = ["embedded"]
# Wokwi PRODUCTION-RUNTIME mode: executes the genuine `runtime::run` loop (T074) with the simulation-only
# board profile. Same runtime function the physical firmware calls — only the injected ports differ.
wokwi-runtime = ["embedded"]
# DEVELOPMENT ONLY (T102; ADR-0005 §3): raw wire-byte tracing. Compiled out of every release artifact;
# `scripts/check-release-surface.sh` proves both its absence and, with the feature on, its presence.
debug-payloads = []
# DEVELOPMENT ONLY: on-panel detent -> flushed-frame latency readout (Slice 002 checklist row 14).
# Never in `default` or a release/product profile; flash with `just fw-flash-latency`.
latency-probe = []

# Path-linked shared crates (single source of truth, no publishing). Declared here to lock the
# isolated cross-workspace path-linking per ADR-0001; consumed once the runtime lands (Phase 7/8).
[dependencies]
kivori-model = { path = "../../crates/kivori-model" }
kivori-protocol = { path = "../../crates/kivori-protocol" }
kivori-framebuffer = { path = "../../crates/kivori-framebuffer" }
kivori-renderer = { path = "../../crates/kivori-renderer" }
kivori-assets = { path = "../../crates/kivori-assets" }
heapless = "0.8"
static_cell = { version = "2.1", optional = true }
# `rt` provides the runtime entry point (`#[esp_hal::main]`) and `init()`; `unstable` is required by
# the peripheral drivers the Phase 8 adapters will use.
esp-hal = { version = "1.1.1", default-features = false, features = ["esp32c3", "rt", "unstable"], optional = true }
esp-println = { version = "0.17", default-features = false, features = ["esp32c3", "uart"], optional = true }
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32c3", "panic-handler", "println"], optional = true }
# T072 display adapter. These are PRODUCTION dependencies (not simulation-only) and are deliberately
# hardware-neutral: `display.rs` speaks only embedded-hal + mipidsi, so it compiles for the host as well
# as riscv and is unit-testable with a recording SPI device. `batch` (default) is dropped — it is not
# needed for windowed writes and pulls in `heapless` inside mipidsi.
mipidsi = { version = "0.10", default-features = false }
embedded-hal = "1.0"
embedded-graphics-core = "0.4"
# Only the esp-hal board wiring needs the bus/CS wrapper, so it rides on `embedded`.
embedded-hal-bus = { version = "0.3", default-features = false, optional = true }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c3"] }

[build-dependencies]
# Host-side, build-time only: compiles the canonical asset blob for the `wokwi` self-test (see build.rs).
# Never linked into the device binary — the firmware reads the compiled bytes, never source art.
kivori-asset-compiler = { path = "../../tools/asset-compiler" }

[dev-dependencies]
# Host-only: compiles the canonical asset blob for the render-parity test. Never in the riscv build.
kivori-asset-compiler = { path = "../../tools/asset-compiler" }

[profile.release]
opt-level = "s"
lto = true
