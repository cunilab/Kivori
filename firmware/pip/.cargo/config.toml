[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# Flashes over USB: needs the board in BOOTSEL mode (hold BOOT while plugging in, or the 1200-baud
# touch `just fw-flash` relies on) and `cargo install elf2uf2-rs`.
runner = "elf2uf2-rs -d"
# cortex-m-rt supplies the vector table through `link.x` (memory layout from `memory.x`). Only the
# device target needs it; host builds pass an explicit --target and never see these flags.
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x"]
