# Hardware-free ESP32-C3 frame-cost model: a small RV32IMC instruction-set simulator with a cycle
# model, run on the real renderer compiled for riscv32imc (`bench/`). Separate host workspace beside the
# firmware like `../simulator` (ADR-0001, ADR-0018); no firmware or product code is linked into it.
[workspace]

[package]
name = "kivori-pip-frame-cost"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only: the native render of the bench scenes, which the simulator's result must equal bit for bit.
[dev-dependencies]
kivori-firmware = { path = "..", default-features = false }
kivori-assets = { path = "../../../crates/kivori-assets" }
kivori-model = { path = "../../../crates/kivori-model" }
kivori-renderer = { path = "../../../crates/kivori-renderer" }
kivori-asset-compiler = { path = "../../../tools/asset-compiler" }
