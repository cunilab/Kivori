# Host CI (skeleton — expanded in Phase 14 / T110). Hardware-free and window-automation-free.
name: host
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The release feature-surface guard also builds the firmware library for the device target.
          targets: riscv32imc-unknown-none-elf
          components: rustfmt, clippy
      - name: Install Tauri v2 + serial system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the Windows Core Audio backend
        if: runner.os == 'Windows'
        run: cargo build -p kivori-desktop
      - name: Volume backend contract suite (fake everywhere; real backend skips without an endpoint)
        if: runner.os == 'Windows'
        run: cargo test -p kivori-desktop --test volume_backend_contract -- --nocapture
      - name: Direct-dependency firewall (ADR-0001)
        run: bash scripts/check-crate-boundaries.sh
        shell: bash
      - name: Offline dependency guard (FR-029)
        run: bash scripts/check-offline-deps.sh
        shell: bash
      - name: Release feature-surface guard (T104, FR-028, ADR-0005)
        if: runner.os == 'Linux'
        run: bash scripts/check-release-surface.sh
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run test
      - run: bun run build
      - name: Frontend offline-asset guard (FR-029, SC-006)
        run: node scripts/check-frontend-offline.mjs
      - name: Production mock-exclusion guard (T124, FR-028)
        run: node scripts/check-mock-excluded.mjs

  windows-device-studio-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Build Device Studio frontend
        run: bun --filter kivori-desktop-ui build
      - name: Build Device Studio native binary
        run: cargo build -p kivori-desktop
      - name: Launch Device Studio and verify startup
        shell: powershell
        run: .\scripts\test-windows-device-studio-startup.ps1
