# Release pipeline (M3 S5; docs/release.md). Builds the product firmware, then the unsigned Windows NSIS
# installer with the pinned espflash sidecar, installs it silently on the runner and smoke-tests it.
# A release tag also fills the DRAFT GitHub release, creating it when there is none: a call from the
# Release button (release-start.yml) with `tag`, or a `v*` tag pushed by hand. Nothing is published
# automatically, a release is never marked pre-release, and a published release is never changed.
# The installer is signed for the updater (ADR-0015) when the TAURI_SIGNING_PRIVATE_KEY secret exists, and
# latest.json is attached. Windows code signing is a placeholder that waits on owner certificates (#36).
name: release
on:
  push:
    tags: ['v*']
  # Called by release-start.yml (the Release button) after it pushed the release commit and tags (a tag
  # pushed with GITHUB_TOKEN does not trigger the push event above). `tag` is the new vX.Y.Z tag.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and attach to (vX.Y.Z)'
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # Declared so the macOS job can read them when called; it only runs on a manual dispatch.
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also build the macOS .app/.dmg (uses a macOS runner)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-info.mjs'
      - 'scripts/updater-manifest.mjs'
      - 'apps/desktop/package.json'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'apps/desktop/src-tauri/Info.plist'
      - 'apps/desktop/src-tauri/Entitlements.plist'
      - 'apps/desktop/src-tauri/nsis/**'
      - 'bun.lock'
      - 'scripts/fetch-espflash.*'
      - 'scripts/bundle-macos.sh'
      - 'scripts/check-release-surface.sh'
      - 'scripts/test-windows-device-studio-startup.ps1'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

env:
  ESPFLASH_VERSION: '4.6.0' # keep in sync with scripts/fetch-espflash.{sh,ps1}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When called, github.ref is the commit the Release button started from, before its bump.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - name: Build the product firmware (physical ST7789 + rotary runtime)
        working-directory: firmware/pala
        run: cargo build --locked --release --target riscv32imc-unknown-none-elf --no-default-features --features physical-st7789
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: firmware/pala/target/riscv32imc-unknown-none-elf/release/kivori-firmware
          if-no-files-found: error

  windows:
    needs: firmware
    runs-on: windows-latest
    permissions:
      contents: write # only used by the draft-release step, which runs for a release tag
    env:
      # Set the repository variable WINDOWS_SIGNING=true once the signing step below is filled in.
      WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the previous app tag is needed for the release notes
      - name: Release tag (empty when this is not a release run)
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG}"
          if [ -z "$tag" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: '${tag}'"
      - name: The tag must equal the workspace version
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -n1)"
          if [ "${{ steps.release.outputs.tag }}" != "v${version}" ]; then
            echo "Tag ${{ steps.release.outputs.tag }} does not match the workspace version v${version} (Cargo.toml)." >&2
            exit 1
          fi
      - name: Updater signing key (ADR-0015)
        id: updater
        shell: bash
        env:
          # Never read on pull requests. Empty until the owner adds the secret (docs/release.md).
          KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$KEY" ]; then
            # A signed release must be verifiable by the app: the matching public key has to be in
            # the release config, or installed apps could never install it (ADR-0015).
            pubkey="$(node -p "(require('./apps/desktop/src-tauri/tauri.release.conf.json').plugins?.updater?.pubkey ?? '').trim()")"
            if [ -z "$pubkey" ]; then
              echo "::error title=Updater public key missing::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey in apps/desktop/src-tauri/tauri.release.conf.json is empty. Put the public key (~/.tauri/kivori-updater.key.pub) there first; see docs/release.md, One-time owner setup."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ -n "${{ steps.release.outputs.tag }}" ]; then
              echo "::warning title=Release is not updatable::TAURI_SIGNING_PRIVATE_KEY is not set, so no updater signature or latest.json is produced. Installed apps will not see this release. See docs/release.md, One-time owner setup."
            else
              echo "::notice::No TAURI_SIGNING_PRIVATE_KEY: building without updater artifacts."
            fi
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned espflash sidecar
        shell: pwsh
        run: ./scripts/fetch-espflash.ps1
      - uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: ${{ runner.temp }}/firmware
      - run: bun install --frozen-lockfile
      - run: bun --filter kivori-desktop-ui build
      - name: Build the NSIS installer
        working-directory: apps/desktop
        shell: bash
        env:
          KIVORI_FIRMWARE_PATH: ${{ runner.temp }}/firmware/kivori-firmware
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--config src-tauri/tauri.release.conf.json)
          # tauri.release.conf.json asks for updater artifacts; without the key that would fail the build.
          if [ '${{ steps.updater.outputs.enabled }}' != 'true' ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          bunx tauri build "${args[@]}" -- --no-default-features
      - name: Locate the installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          installer="$(ls target/release/bundle/nsis/*-setup.exe | head -n1)"
          echo "path=${installer}" >> "$GITHUB_OUTPUT"
          echo "Installer: ${installer}"
          if [ '${{ steps.updater.outputs.enabled }}' = 'true' ]; then
            test -s "${installer}.sig" || { echo "Missing ${installer}.sig although the signing key is set." >&2; exit 1; }
          fi
      # PLACEHOLDER (#36, runs only when the WINDOWS_SIGNING repository variable is 'true'). Fails closed
      # so a missing implementation can never ship as "signed". Fill in with one of:
      #   - Azure Trusted Signing: secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and the
      #     account/profile names, via azure/trusted-signing-action;
      #   - a code-signing certificate: secrets WINDOWS_CERTIFICATE (base64 .pfx) and
      #     WINDOWS_CERTIFICATE_PASSWORD, via signtool on the installer, the app exe and espflash.exe
      #     (set bundle.windows.signCommand in a CI-only config so the inner binaries are signed too).
      - name: Sign the installer (placeholder)
        if: env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          Write-Error 'WINDOWS_SIGNING is true but the signing step is not implemented yet (see #36).'
          exit 1
      - name: Release-surface check on the built exe
        shell: bash
        run: bash scripts/check-release-surface.sh --desktop-artifact target/release/kivori-desktop.exe
      - name: Silent install, sidecar check, startup smoke test, silent uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path '${{ steps.installer.outputs.path }}').Path
          Write-Host "Installing $installer"
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait

          # Tauri v2 keeps the Cargo bin name for the main executable (no `mainBinaryName` override).
          $app = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'kivori-desktop.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) {
              Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Kivori') -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw 'kivori-desktop.exe was not installed under LOCALAPPDATA (per-user install).'
          }
          $dir = $app.DirectoryName
          Write-Host "Installed to $dir"
          $espflash = Join-Path $dir 'espflash.exe'
          if (-not (Test-Path $espflash)) { throw "espflash.exe is missing next to the app executable ($dir)." }

          $reported = (& $espflash --version | Out-String).Trim()
          Write-Host "espflash --version: $reported"
          if ($reported -notmatch [regex]::Escape($env:ESPFLASH_VERSION)) {
              throw "espflash reports '$reported', expected $env:ESPFLASH_VERSION."
          }

          & ./scripts/test-windows-device-studio-startup.ps1 -Exe $app.FullName -Args '--autostart'

          # Stand in for the Launch at login entry the app writes, to prove the uninstall hook removes it.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Set-ItemProperty -Path $run -Name 'Kivori' -Value "`"$($app.FullName)`" --autostart"

          $uninstaller = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw "uninstall.exe is missing in $dir." }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          # NSIS uninstallers re-launch from a temp copy, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $app.FullName) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw 'The app executable is still present after the silent uninstall.' }
          if (Get-ItemProperty -Path $run -Name 'Kivori' -ErrorAction SilentlyContinue) {
              throw 'The HKCU Run entry survived the uninstall (nsis/hooks.nsh).'
          }
          Write-Host 'Install, sidecar, startup smoke and uninstall checks passed.'
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname '${{ steps.installer.outputs.path }}')"
          sha256sum "$(basename '${{ steps.installer.outputs.path }}')" > SHA256SUMS
          cat SHA256SUMS
      - name: Release title and notes
        if: steps.release.outputs.tag != ''
        id: info
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${tag}^" 2>/dev/null || true)"
          # Notes come from the conventional commits since the previous app tag (scripts/release-info.mjs).
          node scripts/release-info.mjs --version "${tag#v}" ${prev:+--prev-tag "$prev"} \
            --repo '${{ github.repository }}' --out-dir "$RUNNER_TEMP/release-info"
          cat "$RUNNER_TEMP/release-info/title.txt"; echo; cat "$RUNNER_TEMP/release-info/notes.md"
      - name: Write latest.json (updater manifest)
        if: steps.release.outputs.tag != '' && steps.updater.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          node scripts/updater-manifest.mjs --version "${tag#v}" --installer '${{ steps.installer.outputs.path }}' \
            --notes "$RUNNER_TEMP/release-info/notes-short.md" --repo '${{ github.repository }}' \
            --out target/release/bundle/nsis/latest.json
          cat target/release/bundle/nsis/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sig
            target/release/bundle/nsis/SHA256SUMS
            target/release/bundle/nsis/latest.json
          if-no-files-found: error
      # One draft per version: the first run for a tag creates it, a re-run updates it. Either way this
      # step sets the title and notes and uploads the assets. It never publishes, never marks a
      # pre-release (the updater ignores pre-releases) and refuses to touch a published release.
      - name: Fill the draft release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dir=target/release/bundle/nsis
          assets=('${{ steps.installer.outputs.path }}' "$dir/SHA256SUMS")
          [ -f "$dir/latest.json" ] && assets+=("$dir/latest.json")
          [ -f '${{ steps.installer.outputs.path }}.sig' ] && assets+=('${{ steps.installer.outputs.path }}.sig')
          title="$(cat "$RUNNER_TEMP/release-info/title.txt")"
          notes="$RUNNER_TEMP/release-info/notes.md"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${TAG}\") | .draft" | head -n1)"
          if [ "$state" = "true" ]; then
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease=false
            gh release upload "$TAG" "${assets[@]}" --clobber
          elif [ -z "$state" ]; then
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes" "${assets[@]}"
          else
            echo "Release ${TAG} is already published; refusing to change it." >&2
            exit 1
          fi

  macos:
    # No macOS runner budget by default: only when dispatched with macos=true. The owner's local
    # scripts/bundle-macos.sh is the main path.
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-14
    env:
      # Placeholders until the owner has an Apple Developer ID (#36). All optional: without
      # APPLE_SIGNING_IDENTITY the bundle is unsigned.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }} # base64 .p12
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }} # notarization: not used by the script yet
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - name: Import the signing certificate (placeholder)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$RUNNER_TEMP/build.keychain"
      - name: Build the macOS bundle
        run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Kivori.app
          if-no-files-found: error
