# Wokwi pre-hardware simulation gate (see sim/wokwi/README.md).
#
# ADDITIONAL gate only. host.yml + firmware.yml remain the PRIMARY gates, and a green run here is never
# evidence of physical hardware correctness.
#
# A green result from this workflow requires an actual Wokwi simulation run. Offline vector/build checks
# are useful preflight evidence, but they must never produce a green Wokwi badge by themselves.
name: wokwi
#
# Only changes that can alter the simulated firmware trigger a run: Wokwi CI minutes are a metered quota,
# and desktop/frontend-only changes cannot affect the simulation.
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'crates/**'
      - 'sim/**'
      - 'tools/wokwi-*/**'
      - 'scripts/*wokwi*'
      - 'scripts/lib/**'
      - 'assets/**'
      - 'Cargo.lock'
      - '.github/workflows/wokwi.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'crates/**'
      - 'sim/**'
      - 'tools/wokwi-*/**'
      - 'scripts/*wokwi*'
      - 'scripts/lib/**'
      - 'assets/**'
      - 'Cargo.lock'
      - '.github/workflows/wokwi.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Detect Wokwi CI token
        id: token
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          # Presence only. The value is never printed, logged, or passed as an argument.
          if [ -n "$WOKWI_CLI_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Wokwi simulation unavailable::WOKWI_CLI_TOKEN is not configured. Offline preflight checks will run, but this workflow will fail before claiming Wokwi simulation success."
          fi

      # Vectors are generated from the real kivori-protocol codec. Regenerate and fail on any diff, so a
      # protocol change cannot silently leave the simulator testing stale bytes.
      - name: Verify generated protocol vectors are current
        run: |
          cargo run -q -p kivori-wokwi-vectors
          # Catch both modified tracked files and generated files that were never committed.
          if [ -n "$(git status --porcelain -- sim/wokwi/generated)" ]; then
            echo "::error title=Stale Wokwi vectors::sim/wokwi/generated is out of date or uncommitted. Run 'cargo run -p kivori-wokwi-vectors' and commit the result."
            git status --porcelain -- sim/wokwi/generated
            git diff -- sim/wokwi/generated | head -50
            exit 1
          fi

      - name: Vector generator tests (determinism, real-codec round-trip, scenario structure)
        run: cargo test -p kivori-wokwi-vectors

      # The VCD checker gates the SPI probe's logic-analyzer capture, so its own tests (including the
      # negative controls) must pass before any capture is trusted.
      - name: VCD checker tests
        run: cargo test -p kivori-wokwi-vcd

      - name: Wokwi evidence-writer tests (offline, no token)
        run: bash scripts/test-wokwi-evidence.sh

      # Built unconditionally: a broken embedded build must fail this job even without a token.
      - name: Build all four simulation firmware artifacts (RISC-V ELFs)
        run: bash scripts/build-wokwi-firmware.sh

      # Do not allow the offline preflight above to masquerade as a successful Wokwi simulation. If the
      # token is missing, the workflow must be red so reviewers can see that no simulator actually ran.
      - name: Require Wokwi CI token for simulation gate
        if: steps.token.outputs.available != 'true'
        run: |
          echo "::error title=Wokwi simulation did not run::WOKWI_CLI_TOKEN is missing. Configure a CI token from https://wokwi.com/dashboard/ci as the repository secret WOKWI_CLI_TOKEN, then rerun this workflow."
          exit 1

      - name: Install the official Wokwi CLI
        if: steps.token.outputs.available == 'true'
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh
          echo "$HOME/.wokwi/bin" >> "$GITHUB_PATH"

      # Every scenario runs explicitly, so a missing scenario cannot be mistaken for a pass. The step
      # fails on any scenario failure, including authentication failure.
      - name: Wokwi scenario — boot (internal self-test)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh boot

      - name: Wokwi scenario — protocol (internal self-test)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh protocol

      - name: Wokwi scenario — state-cycle (internal self-test)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh state-cycle

      - name: Wokwi scenario — serial-smoke (external serial injection)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh serial-smoke

      - name: Wokwi scenario — protocol-serial (external serial injection)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh protocol-serial

      - name: Wokwi scenario — state-cycle-serial (external serial injection)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh state-cycle-serial

      # Stage-2 GENERIC SPI/RGB565 probe. The script captures a VCD and runs the host-side checker over
      # it in the same step, so a missing marker OR a failed VCD validation fails this job. It proves
      # nothing about the physical panel controller (see sim/wokwi/README.md).
      - name: Wokwi scenario — spi-display-probe (generic SPI/RGB565, with VCD validation)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh spi-display-probe

      # The PRODUCTION runtime itself, under simulation: the same `runtime::run` the physical firmware
      # calls, wired through a simulation-only board profile. Proves nothing about the physical panel.
      - name: Wokwi scenario — production-runtime (real run loop, with VCD validation)
        if: steps.token.outputs.available == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: bash scripts/test-wokwi.sh production-runtime

      # Serial logs, the machine-readable run summary, and the VCD logic-analyzer captures are the gate's
      # evidence, so upload them even when a scenario failed.
      - name: Upload Wokwi serial logs, summary.json, and VCD captures
        if: always() && steps.token.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-evidence
          path: |
            target/wokwi-logs/
            target/wokwi-vcd/
          if-no-files-found: warn
