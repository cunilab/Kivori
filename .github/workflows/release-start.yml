# Trunk-based release: prepare opens an on-demand version PR; finalize tags its exact merged,
# CI-green main commit and builds a draft. Neither stage pushes to main or publishes a release.
name: Release
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'prepare opens the version PR; finalize tags its merged, CI-green commit'
        type: choice
        options: [prepare, finalize]
        default: prepare
      release_pr:
        description: 'Merged version PR number (required for finalize)'
        type: string
        default: ''
      app_bump:
        description: 'App version bump for prepare. A reviewable version edit is required; exact app_version overrides this. Below 1.0.0, major still gives 1.0.0.'
        type: choice
        options: [none, patch, minor, major]
        # none, so a careless click never skips a version: once the current version is tagged, none
        # is refused and the bump has to be chosen on purpose.
        default: none
      app_version:
        description: 'Exact app version X.Y.Z instead of the bump (optional, must be greater than the latest v* tag)'
        type: string
        required: false
        default: ''
      product:
        description: 'Optional active product id for firmware changes; empty is allowed for a single-product catalog.'
        type: string
        required: false
        default: ''
      firmware_bump:
        description: 'Firmware bump for the selected product. With multiple products select a product or use firmware_overrides.'
        type: choice
        options: [none, patch, minor, major]
        default: none
      firmware_version:
        description: 'Exact firmware version A.B.C; with multiple products, product must be selected.'
        type: string
        required: false
        default: ''
      firmware_overrides:
        description: 'Optional JSON map of product ids to bumps or exact versions, e.g. {"product-a":"patch","product-b":"0.3.0"}. Cannot mix with the single-product controls.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run: compute and print the versions and notes, change nothing'
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, start to draft; a second run waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  start:
    if: inputs.stage == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch, never main
      pull-requests: write # on-demand version PR
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Release only from main::Run the Release workflow on the main branch (it was started on ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history and tags: tag checks and the release notes need them
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the release scripts
        run: node --test scripts/release-tools.test.mjs scripts/firmware-release-guard.test.mjs scripts/release-finalize.test.mjs
      - name: Compute the versions
        id: plan
        env:
          PRODUCT: ${{ inputs.product }}
          APP_BUMP: ${{ inputs.app_bump }}
          APP_VERSION: ${{ inputs.app_version }}
          FIRMWARE_BUMP: ${{ inputs.firmware_bump }}
          FIRMWARE_VERSION: ${{ inputs.firmware_version }}
          FIRMWARE_OVERRIDES: ${{ inputs.firmware_overrides }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mode=--write
          if [ "$DRY_RUN" = true ]; then mode=--dry-run; fi
          args=(--app "$APP_BUMP" --app-version="$APP_VERSION"
            --firmware "$FIRMWARE_BUMP" --firmware-version="$FIRMWARE_VERSION"
            "$mode" --outputs "$GITHUB_OUTPUT")
          if [ -n "$PRODUCT" ]; then args+=(--product "$PRODUCT"); fi
          if [ -n "$FIRMWARE_OVERRIDES" ]; then args+=(--firmware-overrides "$FIRMWARE_OVERRIDES"); fi
          bun scripts/release-bump.mjs "${args[@]}" | tee "$RUNNER_TEMP/plan.txt"
      - name: Release notes preview
        env:
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
          FIRMWARE_VERSIONS: ${{ steps.plan.outputs.firmware_versions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          bun scripts/release-info.mjs --version "$APP_VERSION" --firmware-versions "$FIRMWARE_VERSIONS" \
            --repo "$GITHUB_REPOSITORY" ${prev:+--prev-tag "$prev"} \
            --out-dir "$RUNNER_TEMP/release-info"
          {
            if [ "$DRY_RUN" = true ]; then echo '## Release dry run: nothing was changed'; else echo '## Release'; fi
            echo; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; echo
            if [ -n "$prev" ]; then
              echo "Notes since ${prev} (the draft gets the same, generated again from the tag):"
            else
              echo "First release: a short note instead of the history (the draft gets the same, generated again from the tag):"
            fi
            echo
            echo "# $(cat "$RUNNER_TEMP/release-info/title.txt")"; echo
            cat "$RUNNER_TEMP/release-info/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-info/title.txt"; echo; cat "$RUNNER_TEMP/release-info/notes.md"
      # App versions also appear in every firmware lockfile through workspace path dependencies.
      - name: Refresh all Cargo.lock files
        if: ${{ !inputs.dry_run && steps.plan.outputs.commit_needed == 'true' }}
        env:
          FIRMWARE_CRATES: ${{ steps.plan.outputs.firmware_crates }}
          RELEASE_FILES: ${{ steps.plan.outputs.release_files }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const run = (cmd, args, cwd = '.') => execFileSync(cmd, args, { cwd, stdio: 'inherit' });
          for (const cwd of ['.', ...JSON.parse(process.env.FIRMWARE_CRATES)]) {
            run('cargo', ['update', '--workspace'], cwd);
            execFileSync('cargo', ['metadata', '--locked', '--format-version', '1'], { cwd, stdio: ['ignore', 'ignore', 'inherit'] });
          }
          const allowed = new Set(JSON.parse(process.env.RELEASE_FILES));
          const changed = [
            ...execFileSync('git', ['diff', '--name-only', '-z', 'HEAD']).toString().split('\0'),
            ...execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z']).toString().split('\0'),
          ].filter(Boolean);
          for (const path of changed) {
            if (!allowed.has(path)) throw new Error(`Unexpected change in ${path}; a release commit only changes versions.`);
          }
          JS
          git diff --stat
      - name: Commit version branch
        if: ${{ !inputs.dry_run }}
        id: request
        env:
          APP_TAG: ${{ steps.plan.outputs.app_tag }}
          RELEASE_FILES: ${{ steps.plan.outputs.release_files }}
          COMMIT_BODY: ${{ steps.plan.outputs.commit_body }}
          COMMIT_NEEDED: ${{ steps.plan.outputs.commit_needed }}
        run: |
          set -euo pipefail
          if [ "$COMMIT_NEEDED" != true ]; then
            echo '::error::No version changes to review. Choose a new app version or bump.' >&2
            exit 1
          fi
          branch="release/${APP_TAG}"
          if [ -n "$(git ls-remote --heads origin 'refs/heads/release/v*')" ]; then
            echo '::error::A release branch already exists. Finish or discard its PR first.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          execFileSync('git', ['add', '--', ...JSON.parse(process.env.RELEASE_FILES)], { stdio: 'inherit' });
          JS
          git commit -m "chore(release): ${APP_TAG}" -m "$COMMIT_BODY"
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::Unexpected changes remain after preparing the version commit.' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open draft version PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.request.outputs.branch }}
          APP_TAG: ${{ steps.plan.outputs.app_tag }}
          COMMIT_BODY: ${{ steps.plan.outputs.commit_body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "$COMMIT_BODY" 'Mark ready for review to start PR CI. Squash-merge after CI and owner approval, then run Release with stage=finalize and this PR number. No tags or release have been created.' > "$RUNNER_TEMP/version-pr.md"
          gh pr create --draft --base main --head "$RELEASE_BRANCH" --title "chore(release): ${APP_TAG}" --body-file "$RUNNER_TEMP/version-pr.md"
          # The owner marks this draft ready; that user event starts required PR CI.

  finalize:
    if: inputs.stage == 'finalize'
    runs-on: ubuntu-latest
    permissions:
      contents: write # immutable tags only, never main
      pull-requests: read
      actions: read
    outputs:
      tag: ${{ steps.finalize.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Finalize cannot be a dry run
        if: inputs.dry_run
        run: |
          echo '::error::Use stage=prepare for a dry run, or finalize with dry_run=false.' >&2
          exit 1
      - name: Tag the approved release commit
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: bun scripts/release-finalize.mjs --pr "$RELEASE_PR" --outputs "$GITHUB_OUTPUT"

  release:
    needs: finalize
    permissions:
      contents: write # the draft release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.finalize.outputs.tag }}
    secrets: inherit
