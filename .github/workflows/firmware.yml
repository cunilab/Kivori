# Firmware CI (skeleton). Proves no_std/no-alloc feature isolation by compiling the shared crates for
# the RISC-V target. NO hardware tests run here (isolation requirement); on-device checks are manual
# (Phase 15). The full firmware binary build (esp-hal runtime) is added in Phase 8 (T070+).
name: firmware
on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-std-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rustfmt, clippy
      - name: Compile the firmware library for RISC-V (no_std / no-alloc isolation proof)
        working-directory: firmware/esp32-c3
        # Building the library pulls in all five shared crates + the device core; the bin target is
        # skipped (its `embedded` feature is off) until the esp-hal runtime lands in Phase 8.
        run: cargo build --lib
      # T076: the hardware adapters are built COMPILE-ONLY. No hardware test runs here, and none can —
      # this job has no board and no simulator. Every feature configuration that ships or is gated is
      # compiled, so a broken adapter fails CI instead of surfacing at flash time.
      # `physical-st7789` is the configuration that actually ships to the device (ST7789 display +
      # HW-040 rotary adapter) — it must be built here, not just `embedded` (which only reaches
      # main.rs's bare fallback and compiles neither adapter).
      - name: Build the hardware adapters compile-only (no hardware test)
        working-directory: firmware/esp32-c3
        run: |
          cargo build --release --features embedded
          cargo build --release --features embedded,debug-payloads
          cargo build --release --features physical-st7789
          cargo build --release --features physical-st7789,debug-payloads
      - name: Firmware format + clippy (RISC-V, every feature configuration)
        working-directory: firmware/esp32-c3
        run: |
          cargo fmt --all --check
          cargo clippy --lib -- -D warnings
          cargo clippy --lib --features embedded -- -D warnings
          cargo clippy --lib --features wokwi-runtime -- -D warnings
          cargo clippy --lib --features wokwi-spi -- -D warnings
          cargo clippy --lib --features wokwi-serial -- -D warnings
          cargo clippy --lib --features physical-st7789 -- -D warnings

  host-sim-tests:
    # The hardware-neutral device core is validated on the host (FR-035). The forced RISC-V build
    # target is overridden with the host triple so std + the asset compiler (dev-dep) are available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Device-core host simulation tests (handshake, dispatch, render parity)
        working-directory: firmware/esp32-c3
        run: cargo test --features host-sim --target x86_64-unknown-linux-gnu
      - name: Host-sim clippy
        working-directory: firmware/esp32-c3
        run: cargo clippy --features host-sim --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
