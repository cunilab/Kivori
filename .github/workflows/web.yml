# Website CI/CD (apps/web): Next.js on Cloudflare Workers via OpenNext.
#
# PRs build and size-check without publishing version URLs. Pushes to main deploy to the permanent
# workers.dev URL when CLOUDFLARE_API_TOKEN exists; otherwise deployment skips cleanly.
name: web
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'assets/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'assets/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The account id is not secret: a repository variable, with the old secret as a fallback.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Build (next build)
        run: bun --filter kivori-web build

      - name: Leak check (client-facing output)
        run: bun --filter kivori-web check:leaks

      - name: Build (OpenNext for Cloudflare)
        working-directory: apps/web
        run: bunx opennextjs-cloudflare build

      - name: Report compressed Worker size
        working-directory: apps/web
        shell: bash
        run: |
          bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run" | tee "$RUNNER_TEMP/dry-run.log"
          size=$(grep 'Total Upload' "$RUNNER_TEMP/dry-run.log" || true)
          echo "### Worker size" >> "$GITHUB_STEP_SUMMARY"
          echo "${size:-unavailable} (Free plan limit: 3 MiB gzip; Paid: 10 MiB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Cloudflare API token
        if: github.event_name == 'push'
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Presence only. The value is never printed, logged, or passed as an argument.
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN is not configured. The site was built and size-checked only."
          fi

      - name: Apply D1 migrations
        if: steps.cf.outputs.available == 'true' && github.event_name == 'push'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations apply kivori-web --remote

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.available == 'true' && github.event_name == 'push'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx opennextjs-cloudflare deploy
