# Weekly dependency updates as a few grouped PRs (minor and patch together, majors on their own).
# Titles read `chore(deps): …` / `ci(deps): …`, so release notes leave them out.
# firmware/pala is left out on purpose: any change there is a firmware input, so it needs a firmware
# version bump and a hardware test at the next release. Update it by hand when doing firmware work.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
