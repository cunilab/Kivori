<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1074" viewBox="0 0 1464 1074">
  <defs>
    <style>
      .bg{fill:#07366a}
      .line{fill:none;stroke:#f4f7fb;stroke-width:2}
      .thin{fill:none;stroke:#b9d1ea;stroke-width:1.3}
      .dash{fill:none;stroke:#8db2d7;stroke-width:1.2;stroke-dasharray:10 7}
      .dim{fill:none;stroke:#f4f7fb;stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}
      .txt{fill:#f4f7fb;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-size:24px;font-weight:700}
      .label{font-size:18px}
      .small{font-size:16px}
      .tiny{font-size:14px}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#f4f7fb"/>
    </marker>
  </defs>

  <rect class="bg" width="1464" height="1074"/>
  <rect x="20" y="16" width="1424" height="742" class="thin"/>
  <text x="42" y="46" class="txt title">1. TOP VIEW - FACEPLATE LAYOUT</text>
  <line x1="42" y1="55" x2="438" y2="55" class="line"/>

  <!-- 100 x 70 mm faceplate; scale 10 px/mm -->
  <rect x="260" y="126" width="1000" height="700" rx="80" ry="80" class="line"/>

  <!-- centerlines -->
  <line x1="240" y1="476" x2="1280" y2="476" class="dash"/>
  <line x1="760" y1="108" x2="760" y2="842" class="dash"/>

  <!-- overall width -->
  <line x1="260" y1="82" x2="1260" y2="82" class="dim"/>
  <line x1="260" y1="70" x2="260" y2="126" class="thin"/>
  <line x1="1260" y1="70" x2="1260" y2="126" class="thin"/>
  <text x="708" y="70" class="txt label">100.00 mm</text>

  <!-- overall height -->
  <line x1="184" y1="126" x2="184" y2="826" class="dim"/>
  <line x1="184" y1="126" x2="260" y2="126" class="thin"/>
  <line x1="184" y1="826" x2="260" y2="826" class="thin"/>
  <text x="100" y="486" class="txt label">70.00 mm</text>

  <!-- radius -->
  <line x1="1226" y1="150" x2="1322" y2="88" class="line"/>
  <text x="1330" y="92" class="txt label">R8.00</text>

  <!-- rotary knob, centered vertically -->
  <circle cx="500" cy="476" r="240" class="line"/>
  <circle cx="500" cy="476" r="224" class="thin"/>
  <circle cx="412" cy="390" r="20" class="line"/>
  <line x1="500" y1="220" x2="500" y2="732" class="dash"/>
  <line x1="244" y1="476" x2="756" y2="476" class="dash"/>

  <line x1="260" y1="706" x2="740" y2="706" class="dim"/>
  <line x1="260" y1="688" x2="260" y2="722" class="thin"/>
  <line x1="740" y1="688" x2="740" y2="722" class="thin"/>
  <text x="438" y="735" class="txt label">Ø48.00 mm</text>

  <!-- display visible area 23.4 x 23.4, centered over middle button -->
  <rect x="823" y="260" width="234" height="234" rx="18" ry="18" class="line"/>
  <rect x="839" y="276" width="202" height="202" rx="12" ry="12" class="thin"/>
  <line x1="940" y1="242" x2="940" y2="514" class="dash"/>
  <line x1="805" y1="377" x2="1075" y2="377" class="dash"/>

  <line x1="823" y1="222" x2="1057" y2="222" class="dim"/>
  <line x1="823" y1="214" x2="823" y2="260" class="thin"/>
  <line x1="1057" y1="214" x2="1057" y2="260" class="thin"/>
  <text x="866" y="208" class="txt label">23.40 mm</text>

  <line x1="1096" y1="260" x2="1096" y2="494" class="dim"/>
  <line x1="1057" y1="260" x2="1110" y2="260" class="thin"/>
  <line x1="1057" y1="494" x2="1110" y2="494" class="thin"/>
  <text x="1114" y="384" class="txt label">23.40 mm</text>

  <!-- buttons: 14 x 14 mm, 18 mm center-to-center; middle aligned to display -->
  <!-- left +8deg, center 0, right -8deg -->
  <g transform="translate(760 620) rotate(-8)">
    <rect x="-70" y="-70" width="140" height="140" rx="18" ry="18" class="line"/>
    <rect x="-57" y="-57" width="114" height="114" rx="14" ry="14" class="thin"/>
    <line x1="-85" y1="0" x2="85" y2="0" class="dash"/>
    <line x1="0" y1="-85" x2="0" y2="85" class="dash"/>
  </g>
  <g transform="translate(940 620)">
    <rect x="-70" y="-70" width="140" height="140" rx="18" ry="18" class="line"/>
    <rect x="-57" y="-57" width="114" height="114" rx="14" ry="14" class="thin"/>
    <line x1="-85" y1="0" x2="85" y2="0" class="dash"/>
    <line x1="0" y1="-85" x2="0" y2="85" class="dash"/>
  </g>
  <g transform="translate(1120 620) rotate(8)">
    <rect x="-70" y="-70" width="140" height="140" rx="18" ry="18" class="line"/>
    <rect x="-57" y="-57" width="114" height="114" rx="14" ry="14" class="thin"/>
    <line x1="-85" y1="0" x2="85" y2="0" class="dash"/>
    <line x1="0" y1="-85" x2="0" y2="85" class="dash"/>
  </g>

  <!-- subtle arc -->
  <path d="M690 662 Q940 574 1190 662" class="dash"/>

  <!-- button center spacing -->
  <line x1="760" y1="548" x2="940" y2="548" class="dim"/>
  <line x1="940" y1="548" x2="1120" y2="548" class="dim"/>
  <text x="798" y="532" class="txt small">18.00 mm</text>
  <text x="978" y="532" class="txt small">18.00 mm</text>

  <!-- 14 mm -->
  <line x1="1160" y1="550" x2="1160" y2="690" class="dim"/>
  <line x1="1120" y1="550" x2="1180" y2="550" class="thin"/>
  <line x1="1120" y1="690" x2="1180" y2="690" class="thin"/>
  <text x="1188" y="626" class="txt label">14.00 mm</text>

  <!-- three-button total span 50mm -->
  <line x1="690" y1="722" x2="1190" y2="722" class="dim"/>
  <line x1="690" y1="702" x2="690" y2="736" class="thin"/>
  <line x1="1190" y1="702" x2="1190" y2="736" class="thin"/>
  <text x="888" y="750" class="txt label">50.00 mm</text>

  <!-- lower component reference -->
  <rect x="20" y="776" width="1424" height="278" class="thin"/>
  <text x="42" y="810" class="txt title">2. COMPONENT SIZE REFERENCE</text>
  <line x1="42" y1="820" x2="400" y2="820" class="line"/>

  <!-- knob ref -->
  <text x="214" y="852" class="txt small">ROTARY KNOB</text>
  <circle cx="240" cy="934" r="80" class="line"/>
  <circle cx="240" cy="934" r="74" class="thin"/>
  <circle cx="200" cy="900" r="10" class="line"/>
  <line x1="160" y1="934" x2="320" y2="934" class="dash"/>
  <line x1="240" y1="854" x2="240" y2="1014" class="dash"/>
  <line x1="336" y1="854" x2="336" y2="1014" class="dim"/>
  <text x="354" y="942" class="txt label">Ø48.00 mm</text>

  <!-- display ref -->
  <line x1="500" y1="836" x2="500" y2="1030" class="thin"/>
  <text x="622" y="852" class="txt small">DISPLAY (VISIBLE AREA)</text>
  <rect x="650" y="886" width="117" height="117" rx="12" ry="12" class="line"/>
  <line x1="708.5" y1="872" x2="708.5" y2="1017" class="dash"/>
  <line x1="636" y1="944.5" x2="781" y2="944.5" class="dash"/>
  <line x1="650" y1="864" x2="767" y2="864" class="dim"/>
  <text x="676" y="854" class="txt small">23.40 mm</text>
  <line x1="790" y1="886" x2="790" y2="1003" class="dim"/>
  <text x="810" y="952" class="txt small">23.40 mm</text>

  <!-- button ref -->
  <line x1="988" y1="836" x2="988" y2="1030" class="thin"/>
  <text x="1110" y="852" class="txt small">BUTTON (OPENING)</text>
  <rect x="1140" y="906" width="70" height="70" rx="10" ry="10" class="line"/>
  <line x1="1130" y1="941" x2="1220" y2="941" class="dash"/>
  <line x1="1175" y1="896" x2="1175" y2="986" class="dash"/>
  <line x1="1140" y1="884" x2="1210" y2="884" class="dim"/>
  <text x="1144" y="874" class="txt small">14.00 mm</text>
  <line x1="1234" y1="906" x2="1234" y2="976" class="dim"/>
  <text x="1254" y="948" class="txt small">14.00 mm</text>

  <text x="42" y="1042" class="txt tiny">Concept drawing. Verify enclosure clearances against physical ST7789 module, encoder body, switch caps, PCB, and wiring before CAD release.</text>
</svg>