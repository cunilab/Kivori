# Wokwi project for the Kivori ESP32-C3 pre-hardware simulation gate.
#
# Loads the REAL firmware ELF built from firmware/pala with the `wokwi` feature (see
# scripts/build-wokwi-firmware.sh). Simulation is an ADDITIONAL gate: it never replaces the host-sim
# tests, and it is never evidence of physical correctness — see README.md "What this does not prove".
[wokwi]
version = 1
# Paths are relative to this file.
elf = "../../firmware/pala/target/riscv32imc-unknown-none-elf/release/kivori-firmware"
firmware = "../../firmware/pala/target/riscv32imc-unknown-none-elf/release/kivori-firmware"
