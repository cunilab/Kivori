# Wokwi scenario: GENERIC SPI / RGB565 tile-transfer probe (stage 2, T131).
#
# Runs `kivori-spi.elf` (--features wokwi-spi) against `diagram-spi.json`, where a built-in
# `wokwi-ili9341` part stands in as a GENERIC SPI display sink. Lines come from
# firmware/desk-buddy/src/spi_probe.rs and are printed only AFTER the work they name has completed and its
# post-condition has been checked.
#
# SCOPE — this asserts generic bus and tile-stream properties only:
#   * the SPI peripheral initialises and the panel reset line is sequenced
#   * command and data phases are distinguishable (D/C), transactions are CS-framed
#   * thirty-six 40x40 RGB565 tiles per frame, 1,600 pixels each, in row-major order
#   * an exact deterministic byte volume per frame
#   * an unchanged frame retransmits nothing; a changed state retransmits
#
# NOT IN SCOPE — the physical panel controller is unconfirmed, so nothing here validates an ILI9341,
# ST7789, or GC9A01 initialisation sequence, panel offsets, orientation, colour order, or backlight, and
# no electrical property (signal integrity, timing margin, real frame rate) is proven. See
# sim/wokwi/README.md "What this does not prove".
#
# Every `wait-serial` fails the run on timeout, so a panic, a hang, or a missing stage all surface as a
# scenario failure. `ALL PASS` is emitted only when every stage above passed.
name: kivori-spi-display-probe
version: 1
author: Kivori
steps:
  # 1. Readiness: the probe reached Rust main and reported the simulation-only pin profile.
  - wait-serial: 'KIVORI-SPI BOOT firmware=kivori-firmware target=esp32c3 panel=generic-spi'
  # 2. Scope A — bus + GPIO bring-up, then a real reset sequence with D/C and CS activity.
  - wait-serial: 'KIVORI-SPI PASS bus-init'
  - wait-serial: 'KIVORI-SPI PASS reset-sequence'
  # 3. Scope B — solid RGB565 frames, each verified for tile count and exact byte volume.
  - wait-serial: 'KIVORI-SPI PASS rgb-red'
  - wait-serial: 'KIVORI-SPI PASS rgb-green'
  - wait-serial: 'KIVORI-SPI PASS rgb-blue'
  # 4. A non-uniform pattern, so a stuck-at-one-colour bus cannot pass the colour stages.
  - wait-serial: 'KIVORI-SPI PASS checkerboard'
  # 5. The canonical shared renderer over the same bus: tile geometry, then byte volume.
  - wait-serial: 'KIVORI-SPI PASS tile-count-36'
  - wait-serial: 'KIVORI-SPI PASS tile-bytes'
  # 6. Change-driven refresh (FR-013) in both directions.
  - wait-serial: 'KIVORI-SPI PASS unchanged-no-reflush'
  - wait-serial: 'KIVORI-SPI PASS changed-reflush'
  # 7. Completion marker — emitted only if every stage above passed.
  - wait-serial: 'KIVORI-SPI ALL PASS'
