# Wokwi scenario: firmware boot, deterministic clock, and the device-owned lifecycle transition.
#
# Each `wait-serial` step fails the run on timeout, so a panic, a hang, or a missing assertion line all
# surface as a scenario failure. Lines are emitted by firmware/desk-buddy/src/selftest.rs.
name: kivori-boot
version: 1
author: Kivori
steps:
  # 1. The embedded runtime reached Rust main and initialised esp-hal.
  - wait-serial: 'KIVORI-SIM BOOT firmware=kivori-firmware target=esp32c3'
  # 2. Monotonic millisecond clock (ADR-0003): never goes backwards, and actually advances.
  - wait-serial: 'KIVORI-SIM PASS clock-monotonic'
  - wait-serial: 'KIVORI-SIM PASS clock-advances'
  # 3. The device owns `booting` at power-on and falls back to `offline` with no host present (FR-014).
  - wait-serial: 'KIVORI-SIM PASS lifecycle-boots-in-booting'
  - wait-serial: 'KIVORI-SIM PASS lifecycle-booting-to-offline'
