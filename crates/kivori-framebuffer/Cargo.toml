[package]
name = "kivori-framebuffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RGB565 tile/scanline framebuffer + dirty-region primitives (no_std)."

[dependencies]
kivori-model = { path = "../kivori-model" }
# The tile buffer is an embedded-graphics DrawTarget (ADR-0004 drawing stack).
embedded-graphics-core = "0.4"

[dev-dependencies]
# Full embedded-graphics for exercising the DrawTarget with primitives/text in tests.
embedded-graphics = "0.8"
