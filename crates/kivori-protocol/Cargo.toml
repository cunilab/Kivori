[package]
name = "kivori-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kivori device wire protocol codec (no_std + optional std)."

[features]
default = []
# `std` enables host-side conveniences (Vec-based buffers). Firmware uses the default (no_std, no alloc).
std = []

[dependencies]
kivori-model = { path = "../kivori-model" }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
heapless = "0.8"
# CRC-32 (IEEE) and COBS framing are implemented in-crate (no extra deps) for full control + testing.

[dev-dependencies]
# Integration tests (tests/*.rs) are separate crates and need these in scope directly.
kivori-model = { path = "../kivori-model" }
heapless = "0.8"
