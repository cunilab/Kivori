[package]
name = "kivori-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kivori desktop native core (Tauri v2). Host preview renders the shared canonical renderer."

[[bin]]
name = "kivori-desktop"
path = "src/main.rs"

[features]
# Device Studio (dev-only preview commands, FR-028) is on by default so `tauri dev` includes it;
# production/release builds strip it with `--no-default-features`.
default = ["device-studio"]
device-studio = []
# DEV-ONLY: enables raw-payload hex logging paths (ADR-0005 §3). Never enable in a shipped build.
debug-payloads = []

[dependencies]
kivori-model = { path = "../../../crates/kivori-model" }
kivori-assets = { path = "../../../crates/kivori-assets" }
kivori-framebuffer = { path = "../../../crates/kivori-framebuffer" }
kivori-renderer = { path = "../../../crates/kivori-renderer" }
kivori-protocol = { path = "../../../crates/kivori-protocol" }
heapless = "0.8"  # fixed-capacity buffers for the shared protocol codec (no_std-friendly)
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Launch at login (M3 S4), used from Rust only: no JS package and no webview permission.
tauri-plugin-autostart = "~2.5.1"  # 2.6+ requires tauri ^2.12; upgrade the framework deliberately, not via a plugin
serialport = "4"  # production USB-serial transport (research R-5). Windows/macOS build; Linux CI needs libudev-dev.
serde = { version = "1", features = ["derive"] }
# Config file (de)serialization and the now-playing adapter's JSON lines (ADR-0009). Already in the tree via tauri.
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
getrandom = "0.2"  # session-nonce freshness (Slice 002). NOT a security credential; not a network crate.

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Media keys and keyboard shortcuts (M1): SendInput on Windows, Quartz events on macOS. Linux
# would pull X11/Wayland stacks for an unsupported OS, so it stays NotImplemented there.
enigo = { version = "0.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Mach host statistics (CPU/RAM) and localtime_r (M1 monitoring). CoreAudio is declared by hand.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows Core Audio (WASAPI) master-volume backend (Task 12), CPU/RAM and local time (M1), and
# the media session manager for observing playback (M1).
windows = { version = "0.58", features = [
  "implement",
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The `implement` attribute macro (used to author `IAudioEndpointVolumeCallback` /
# `IMMNotificationClient`) expands to paths rooted at `::windows_core`, so that crate name must
# also resolve directly, not just via `windows::core`.
windows-core = "0.58"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Build-time only: compiles the canonical asset blob into OUT_DIR so the app bundles it (no runtime resvg).
kivori-asset-compiler = { path = "../../../tools/asset-compiler" }

[dev-dependencies]
# The asset compiler (resvg) is a BUILD/test tool only — never a desktop runtime dependency.
# The app bundles a pre-compiled blob; tests compile one here.
kivori-asset-compiler = { path = "../../../tools/asset-compiler" }
tempfile = "3"
